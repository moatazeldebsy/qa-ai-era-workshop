site_name: QA Engineering Deep Dive
site_description: A free, self-paced course on quality engineering - back to basics, all the way to leadership. Fourteen topics, hands-on labs you can check, quizzes and a community.
site_url: https://moatazeldebsy.github.io/qa-engineering-deep-dive/
repo_url: https://github.com/moatazeldebsy/qa-engineering-deep-dive
repo_name: moatazeldebsy/qa-engineering-deep-dive
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/robot-happy-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # One collapsible sidebar and a right-hand table of contents, as on
  # docs.litellm.ai - no top tabs. Step pages use "## 1. ..." headings so
  # every step shows up in the table of contents.
  features:
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

# Diagram sources: rendered to docs/assets/diagrams/ by npm run docs:diagrams.
exclude_docs: |
  /diagrams/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/course.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

