name: Lab feedback

# Runs in learners' forks only. Open a pull request from a topic branch
# (topic-01 … topic-14, made by `npm run learn:start`) into your fork's main,
# and on every push this runs `npm run learn:check <topic>` and keeps one
# comment on the PR up to date: ✔ or ✖ for each step, with the hint for
# what's missing. It reports; it never fails the build.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lab-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  K6_VERSION: v2.3.0
  PACT_DO_NOT_TRACK: 'true'
  PROMPTFOO_DISABLE_TELEMETRY: '1'

jobs:
  feedback:
    if: >-
      github.repository != 'moatazeldebsy/qa-engineering-deep-dive' &&
      startsWith(github.head_ref, 'topic-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Some steps run Playwright or k6, so the checker needs the same tools as CI.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"

      - name: Check the lab
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          topic="${BRANCH#topic-}"
          if ! [[ "$topic" =~ ^[0-9]{2}$ ]]; then
            echo "::notice::$BRANCH isn't a topic branch (topic-01 … topic-14); nothing to check."
            exit 0
          fi
          node scripts/learn.mjs check "$topic" --json > check.json || true
          node -e '
            const fs = require("node:fs");
            const t = JSON.parse(fs.readFileSync("check.json", "utf8"));
            const done = t.done === t.total;
            const lines = [
              "<!-- lab-feedback -->",
              `## ${done ? "🎉" : "🧪"} Topic ${t.id}: ${t.title} — ${t.done}/${t.total} steps done`,
              "",
              "| | Step | Detail |",
              "|---|---|---|",
              ...t.results.map((r) => {
                const detail = [r.detail, !r.ok && r.hint ? `→ ${r.hint}` : ""].filter(Boolean).join("<br>").replace(/\|/g, "\\|");
                return `| ${r.ok ? "✔" : "✖"} | ${r.id}. ${r.title} | ${detail} |`;
              }),
              "",
              done
                ? "Lab complete. Next: the quiz and the challenge on the topic page."
                : `Push again to re-check, or run \`npm run learn:check ${t.id}\` for the full output.`,
            ];
            fs.writeFileSync("comment.md", lines.join("\n") + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.slice(1).join("\n") + "\n");
          '

      # One comment per PR, edited in place on every push.
      - name: Post the feedback
        if: hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- lab-feedback -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
