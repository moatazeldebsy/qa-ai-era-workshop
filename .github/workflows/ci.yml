name: CI

# The workshop's own pipeline, and the reference for Lab 7. It runs every
# automated lab in feedback-speed order, then hands the evidence to the quality
# gate, which makes the single pass/fail decision.
#
# Evidence steps use continue-on-error so a failing suite still reaches the
# gate; the gate (and therefore the job) fails if any required check failed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  K6_VERSION: v2.3.0
  PACT_DO_NOT_TRACK: 'true'
  PROMPTFOO_DISABLE_TELEMETRY: '1'
  FORCE_COLOR: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version

      # Same check a learner runs first (k6 and Python are installed above).
      - name: Workshop doctor
        run: npm run doctor

      # ── 1. Fastest feedback first ─────────────────────────────────────────
      - name: Unit tests
        run: npm run test:unit

      # Learning Path, Topic 1: oracles, risk trace, and a planted-bug check.
      - name: Foundations lab
        run: |
          npm run foundations:test
          npm run foundations:risks
          npm run foundations:bug-hunt

      # Learning Path, Topic 2: test-design techniques and a mutation scorecard.
      - name: Test design lab
        run: |
          npm run design:test
          npm run design:mutants

      # Topic 3: unit and component tests, plus Stryker mutation testing.
      - name: Unit and component lab
        run: |
          npm run unit:test
          npm run unit:mutate

      # Topic 4: API, integration and Pact consumer tests (provider
      # verification is the learner's job on main; learn verify checks it).
      - name: Integration and contract lab
        run: npm run contract:test

      # Topic 6: tests for the quality gate itself, and impact analysis.
      - name: CI/CD lab
        run: |
          npm run ci:test
          npm run ci:impact -- app/src/cart.js

      # Topic 7: generated data and the sales report (shared-env and masking
      # are the learner's job on main; learn verify checks them).
      - name: Test data lab
        run: npm run data:test

      # Topic 8: resilience tests with the fault-injecting proxy.
      - name: Resilience lab
        run: npm run perf:test

      # Topic 9: security tests, accessibility tests and a dependency triage
      # (the triage reports; advisories change daily, so it doesn't gate).
      - name: Observability lab
        run: npm run obs:test

      - name: Quality intelligence lab
        run: npm run qi:test

      - name: Platform lab
        run: |
          npm run platform:test
          npm run platform:fleet

      - name: Strategy lab
        run: |
          npm run strategy:test
          npm run strategy:scorecard

      - name: Security and accessibility lab
        run: |
          npm run sec:test
          npm run a11y:test
          npm run sec:audit || echo "::warning::production dependency findings: see the triage above"

      # The course repo must ship every lab unsolved (learners start here) and
      # the solutions branch must solve them all. Forks skip this: a learner's
      # progress is reported by learner-progress.yml instead.
      - name: Labs are still labs
        if: github.repository == 'moatazeldebsy/qa-engineering-deep-dive'
        run: |
          if [ "${GITHUB_REF_NAME}" = "solutions" ]; then
            node scripts/learn.mjs verify --expect complete
          else
            node scripts/learn.mjs verify --expect incomplete
          fi

      # ── 2. API + E2E (Labs 1, 2) → test-results/junit.xml ─────────────────
      - name: API and E2E tests
        id: functional
        continue-on-error: true
        run: npm test

      # Lab 9's agent needs a model, so CI tests its browser tools instead.
      # Before "Start the demo app": like npm test, Playwright starts its own.
      - name: AI agent tools
        run: npm run test:agent-tools

      # The shop's own customer journeys: accounts, checkout, Demo Pay.
      - name: Shop journeys
        run: npm run test:shop

      # The remaining labs need the app running.
      - name: Start the demo app
        run: |
          LOG_REQUESTS=false nohup node app/src/server.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3210/health && exit 0; sleep 1; done
          cat app.log; exit 1

      # ── 3. LLM evaluation (Lab 6) → test-results/llm-eval.json ────────────
      - name: LLM evaluation
        id: llm-eval
        continue-on-error: true
        run: npm run eval:llm

      - name: LLM red team
        id: llm-redteam
        continue-on-error: true
        run: npm run eval:redteam

      # ── 4. Performance smoke (Lab 5) → test-results/k6-summary.json ────────
      - name: Performance smoke
        id: perf
        continue-on-error: true
        run: npm run perf:smoke

      # ── 5. Metrics (Lab 8) — informational ────────────────────────────────
      - name: Quality metrics
        run: npm run metrics

      # ── 6. One decision (Lab 7) ───────────────────────────────────────────
      - name: Quality gate
        run: npm run gate

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Topic 7: a disposable, production-like environment from compose.yaml.
  # Build it, check the two services work together, throw it away.
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start a disposable environment
        run: docker compose up --build --wait

      - name: Smoke-test it
        run: |
          curl -sf localhost:3210/health
          curl -sf localhost:3210/api/orders -H 'content-type: application/json' \
            -d '{"items":[{"bookId":1,"quantity":1}],"paymentToken":"tok_visa","customer":{"email":"ci@example.com"}}'
          curl -sf -H "authorization: Bearer local-dev-token" localhost:3220/stock/1 | grep -q '"available":11'
          echo "✔ shop and inventory work together in containers"

      - name: Throw it away
        if: ${{ always() }}
        run: docker compose down --volumes
