name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'tests/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tests/docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      # Pull requests only check that the site builds; broken links fail it.
      - name: Build (strict)
        run: mkdocs build --strict

      # Quizzes, progress tracking and phone layout, in a real browser.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Course site smoke test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:docs

      # Only the course repository publishes the site; forks just build it.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.repository == 'moatazeldebsy/qa-engineering-deep-dive'
        run: mkdocs gh-deploy --force --clean
