openapi: 3.1.0
info:
  title: Quality Books API
  version: 1.0.0
  description: Quality Books, the course's demo shop. Topic 12 feeds this spec to an AI model to propose test cases.
servers:
  - url: http://localhost:3210
paths:
  /api/books:
    get:
      summary: List or search books
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on title, author or tag.
          schema: { type: string }
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books: { type: array, items: { $ref: '#/components/schemas/Book' } }
  /api/books/{id}:
    get:
      summary: Get one book
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: The book, content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } } }
        '404': { description: Unknown id, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/cart/price:
    post:
      summary: Price a cart
      description: |
        Shipping is 4.90 EUR, free when the subtotal is 50 EUR or more.
        Quantity must be an integer from 1 to 10 and not exceed stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [bookId, quantity]
                    properties:
                      bookId: { type: integer }
                      quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: Priced cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines: { type: array, items: { type: object } }
                  subtotal: { type: number }
                  shipping: { type: number }
                  total: { type: number }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/assistant:
    post:
      summary: Ask the AI support assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: The answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  mode: { type: string, enum: [mock, buggy, claude] }
  /api/auth/register:
    post:
      summary: Create an account and sign in
      description: Sets the session cookie qb_session (HttpOnly, SameSite=Strict, 2 hours).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Email already has an account, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/login:
    post:
      summary: Sign in
      description: Sets the session cookie qb_session. A wrong email and a wrong password get the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Email or password is incorrect, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/logout:
    post:
      summary: Sign out
      responses:
        '204': { description: Signed out; the session cookie is cleared }
  /api/auth/me:
    get:
      summary: Who is signed in
      responses:
        '200':
          description: The signed-in user, or null for a guest
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { oneOf: [{ $ref: '#/components/schemas/User' }, { type: 'null' }] }
  /api/account/orders:
    get:
      summary: The signed-in customer's orders, newest first
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: array, items: { type: object } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    Book:
      type: object
      required: [id, title, author, price, stock, tags]
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        price: { type: number }
        stock: { type: integer }
        tags: { type: array, items: { type: string } }
    Error:
      type: object
      properties:
        error: { type: string }
