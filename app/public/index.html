<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quality Books</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Quality Books</h1>
    <p class="tagline">The demo shop for QA Engineering Deep Dive</p>
    <nav aria-label="Account">
      <a id="account-link" href="/account.html">Sign in</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="catalogue-heading">
      <h2 id="catalogue-heading">Catalogue</h2>
      <label for="search">Search books</label>
      <input id="search" type="search" placeholder="Title, author or topic" />
      <ul id="book-list" aria-live="polite"></ul>
    </section>

    <section id="cart" aria-labelledby="cart-heading" aria-busy="false">
      <h2 id="cart-heading" tabindex="-1">Cart</h2>
      <ul id="cart-lines"></ul>
      <p>Subtotal: <span data-testid="subtotal">0.00</span> EUR</p>
      <p>Shipping: <span data-testid="shipping">0.00</span> EUR</p>
      <p><strong>Total: <span data-testid="total">0.00</span> EUR</strong></p>
      <p id="cart-error" role="alert"></p>
      <a id="checkout-link" class="button-link" href="/checkout.html" hidden>Go to checkout</a>
    </section>

    <section aria-labelledby="recs-heading">
      <h2 id="recs-heading">Recommended for you</h2>
      <p id="recs-loading">Loading recommendations…</p>
      <ul id="recommendations" hidden></ul>
    </section>

    <section aria-labelledby="assistant-heading">
      <h2 id="assistant-heading">Ask our assistant</h2>
      <form id="assistant-form">
        <label for="question">Your question</label>
        <input id="question" name="question" maxlength="1000" />
        <button type="submit">Ask</button>
      </form>
      <p id="assistant-answer" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
