name: service-{{name}}

# Generated by the platform scaffolder. The steps live in the reusable
# workflow, so improving it improves every service at once.
on:
  push:
    paths: ['services/{{name}}/**', 'platform/**']
  pull_request:
    paths: ['services/{{name}}/**', 'platform/**']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable-node-service.yml
    with:
      path: services/{{name}}
